[project]
name = "assignment05"
version = "0.1.0"
description = "Logistics Operations RAG assistant: document analysis, MiniLM embeddings, Chroma, and local Llama 3.2 via Ollama (IIT-KH Assignment 05)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
    "tqdm>=4.66.0",
    "pypdf>=5.0.0",
    "nltk>=3.9.0",
    "scikit-learn>=1.5.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-huggingface>=0.1.0",
    "langchain-chroma>=0.2.0",
    "langchain-ollama>=0.2.0",
    "sentence-transformers>=3.0.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.0.0",
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
