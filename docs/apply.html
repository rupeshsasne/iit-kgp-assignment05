<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iPe · Merchant onboarding</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
  <link rel="stylesheet" href="apply.css">
</head>
<body>
  <div class="app">
    <header class="app-bar">
      <a class="brand" href="ipe-prd.html">
        <span class="material-symbols-outlined">account_balance</span>
        <span><strong>iPe</strong><span>Merchant onboarding</span></span>
      </a>
      <span class="spacer"></span>
      <a class="text-btn req" href="ipe-prd.html">Requirements</a>
      <button class="text-btn" type="button" id="reset">Start over</button>
    </header>
    <div class="body">
      <aside class="drawer">
        <h2>Application</h2>
        <ul class="steps" id="steps"></ul>
      </aside>
      <section class="stage">
        <div class="log" id="log" aria-live="polite"></div>
        <form class="dock" id="dock">
          <div class="chips" id="chips"></div>
          <div class="upload-row" id="uploadRow" hidden>
            <label class="outlined-btn">
              <span class="material-symbols-outlined">upload_file</span>
              <span id="uploadLabel">Upload file</span>
              <input id="file" type="file" hidden>
            </label>
          </div>
          <div class="composer">
            <input id="box" name="message" autocomplete="off" placeholder="Message" aria-label="Message">
            <button class="send" type="submit" aria-label="Send">
              <span class="material-symbols-outlined">send</span>
            </button>
          </div>
        </form>
      </section>
    </div>
  </div>
  <script type="module">
    import { opening, turn } from "./agent.mjs";

    const log = document.querySelector("#log");
    const chips = document.querySelector("#chips");
    const steps = document.querySelector("#steps");
    const box = document.querySelector("#box");
    const form = document.querySelector("#dock");
    const uploadRow = document.querySelector("#uploadRow");
    const uploadLabel = document.querySelector("#uploadLabel");
    const fileInput = document.querySelector("#file");
    const instant = new URLSearchParams(location.search).has("instant");
    let session = null;
    let busy = false;

    function icon(name) {
      const span = document.createElement("span");
      span.className = "material-symbols-outlined";
      span.textContent = name;
      return span;
    }

    function addMessage(message) {
      if (message.card) {
        const card = document.createElement("article");
        card.className = "card";
        const missing = message.card.missing.length ? message.card.missing.join(", ") : "None";
        const lines = [
          ["p", "rid", "Review " + message.card.id + " · " + message.card.status],
          ["p", "", message.card.name + " · " + message.card.city + " · " + message.card.type],
          ["p", "", "Volume " + message.card.volume],
          ["p", "", "For the " + message.card.assignee],
          ["p", "", "Missing: " + missing],
        ];
        for (const [tag, cls, text] of lines) {
          const node = document.createElement(tag);
          if (cls) node.className = cls;
          node.textContent = text;
          card.appendChild(node);
        }
        log.appendChild(card);
      }
      const bubble = document.createElement("article");
      bubble.className = "msg " + (message.from === "merchant" ? "merchant" : "agent");
      const body = document.createElement("p");
      const attached = message.from === "merchant" && /^Attached:\s+/i.test(message.text);
      if (attached) {
        body.className = "file-line";
        body.append(icon("description"), document.createTextNode(message.text.replace(/^Attached:\s+/i, "")));
      } else {
        body.textContent = message.text;
      }
      bubble.appendChild(body);
      if (message.cites) {
        const cite = document.createElement("p");
        cite.className = "cites";
        cite.textContent = message.cites;
        bubble.appendChild(cite);
      }
      log.appendChild(bubble);
      log.scrollTop = log.scrollHeight;
    }

    function drawFields(fields) {
      steps.replaceChildren();
      for (const field of fields) {
        const item = document.createElement("li");
        item.className = field.state;
        const glyph = field.state === "done" ? "check_circle" : field.state === "now" ? "edit" : "radio_button_unchecked";
        const copy = document.createElement("div");
        const label = document.createElement("b");
        label.textContent = field.label;
        const value = document.createElement("em");
        value.textContent = field.value || (field.state === "now" ? "Current" : " ");
        copy.append(label, value);
        item.append(icon(glyph), copy);
        steps.appendChild(item);
      }
    }

    function drawChips(labels) {
      chips.replaceChildren();
      for (const label of labels || []) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = label;
        button.addEventListener("click", () => send(label));
        chips.appendChild(button);
      }
    }

    function show(result) {
      session = result.session;
      drawFields(result.fields);
      drawChips(result.chips);
      const askingFile = !!result.needsFile;
      uploadRow.hidden = !askingFile;
      if (askingFile) {
        uploadLabel.textContent = result.uploadLabel || "Upload file";
        fileInput.accept = result.fileAccept || "";
      }
      box.placeholder = result.session.phase === "confirm"
        ? "Submit, or ask why"
        : result.session.phase === "done"
          ? "Ask about the decision"
          : askingFile
            ? "Ask why, or upload the file"
            : "Your answer, or ask why";
    }

    function send(text) {
      const value = text.trim();
      if (!value || busy) return;
      busy = true;
      addMessage({ from: "merchant", text: value });
      box.value = "";
      const result = turn(session, value);
      const reveal = () => {
        for (const message of result.messages) addMessage(message);
        show(result);
        busy = false;
        box.focus();
      };
      if (instant) reveal();
      else window.setTimeout(reveal, 280);
    }

    function boot() {
      log.replaceChildren();
      fileInput.value = "";
      const result = opening();
      for (const message of result.messages) addMessage(message);
      show(result);
      box.value = "";
      box.focus();
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      send(box.value);
    });
    fileInput.addEventListener("change", () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;
      send("Attached: " + file.name);
      fileInput.value = "";
    });
    document.querySelector("#reset").addEventListener("click", boot);
    boot();
  </script>
</body>
</html>
